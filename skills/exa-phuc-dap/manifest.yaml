name: exa-phuc-dap
version: 0.1.0
description: >
  Vietnamese overlay manifest. Loads fork language and privacy policies and the
  Vietnamese-to-English repair layer, then defers to nature-response, replacing
  the Chinese check block with a Vietnamese author plan.

base_skill: nature-response

always_load:
  - ../nature-shared/vn/language-policy.md
  - ../nature-shared/vn/community-edition.md
  - ../nature-shared/vn/privacy-offline.md
  - ../nature-shared/vn/vi-to-en.md

references:
  on_demand:
    - condition: translating terms between Vietnamese author notes and the English response letter
      path: ../nature-shared/vn/medical-glossary-vi-en.md
